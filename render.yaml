services:
  - type: web
    name: liudu-club-gateway
    runtime: node
    plan: free
    region: singapore
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /gateway-health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIUDU_IP_PROXY_KEY
        sync: false
